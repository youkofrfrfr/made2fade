<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviews | Made2Fade Barbershop</title>
<meta name="description" content="Client reviews for the barbers at Made2Fade in Stafford, VA.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/reviews.js" type="module"></script>
</head>
<body data-page="reviews">

<main>
  <section class="page-hero center">
    <div class="wrap">
      <span class="eyebrow">What Clients Say</span>
      <h1>Client <span class="gold-text">Reviews</span></h1>
      <p>Five-star reviews from real clients on theCut.</p>
    </div>
  </section>
  <section class="page-body center">
    <div class="wrap">
      <div class="rating-big">
        <strong class="gold-text" data-team-rating>5.0</strong>
        <div class="left">
          <div class="stars">★★★★★</div>
          <small><span data-team-count>500+</span> reviews across the team</small>
        </div>
      </div>
      <div class="rating-list" id="ratingList"></div>
      <h2 class="sub-h">Latest <span class="gold-text">Reviews</span></h2>
      <div class="review-grid" id="reviewGrid"></div>
    </div>
  </section>
</main>

</body>
</html>
