<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber | Made2Fade Barbershop</title>
<meta name="description" content="Barber profile at Made2Fade Barbershop in Stafford, VA: cuts, hours, prices and booking.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/barber.js" type="module"></script>
</head>
<body data-page="barbers">

<main id="profile">
  <section class="page-hero">
    <div class="wrap">
      <a class="back-link" href="/barbers.html">← All Barbers</a>
      <div class="profile-head">
        <div class="profile-media" id="pMedia"></div>
        <div class="profile-info">
          <span class="eyebrow">Made2Fade Barbershop</span>
          <h1 class="gold-text" id="pName">Barber</h1>
          <div class="team-nick" id="pNick"></div>
          <div class="team-title" id="pTitle"></div>
          <div id="pRating"></div>
          <div class="barber-status"><i class="status-dot" id="pDot"></i><b id="pStatus"></b></div>
          <p id="pBio"></p>
          <div class="team-actions" id="pActions"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="page-body profile-body">
    <div class="wrap">
      <div class="tabs profile-tabs" role="tablist" id="pTabs">
        <button role="tab" aria-selected="true" aria-controls="tab-cuts" data-tab="cuts">Cuts</button>
        <button role="tab" aria-selected="false" aria-controls="tab-prices" data-tab="prices">Prices</button>
        <button role="tab" aria-selected="false" aria-controls="tab-hours" data-tab="hours">Hours</button>
        <button role="tab" aria-selected="false" aria-controls="tab-reviews" data-tab="reviews" id="pReviewsTab">Reviews</button>
      </div>

      <div class="tab-panel" id="tab-cuts" role="tabpanel">
        <div class="gallery-grid" id="pCuts"></div>
        <p class="empty-note" id="pNoCuts" hidden>No photos posted yet. Check back soon.</p>
      </div>

      <div class="tab-panel card" id="tab-prices" role="tabpanel" hidden>
        <ul class="price-list one-col" id="pPrices"></ul>
        <p class="price-foot">Cash or card accepted at the shop. Book the right service so there's enough time for your appointment.</p>
      </div>

      <div class="tab-panel card" id="tab-hours" role="tabpanel" hidden>
        <ul class="hours" id="pHours"></ul>
        <p class="hours-note" id="pHoursNote"></p>
        <p class="hours-note">60 Susa Dr., Suite 111, Stafford, VA 22554 · <a href="https://www.google.com/maps/dir/?api=1&destination=60+Susa+Drive%2C+Stafford%2C+VA+22554" target="_blank" rel="noopener">Directions</a></p>
      </div>

      <div class="tab-panel" id="tab-reviews" role="tabpanel" hidden>
        <div class="review-grid" id="pReviews"></div>
      </div>
    </div>
  </section>
</main>


</body>
</html>
