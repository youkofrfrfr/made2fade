name: Update theCut reviews

# Every hour, read each barber's public theCut page and commit any new
# ratings, review counts or reviews to data/shop.json. Vercel redeploys on the commit.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: .github/scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Read theCut and update shop.json
        run: node .github/scripts/update-reviews.mjs data/shop.json

      - name: Commit changes
        run: |
          if git diff --quiet data/shop.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "made2fade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shop.json
          git commit -m "Update reviews from theCut"
          git push
