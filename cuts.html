<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuts | Made2Fade Barbershop</title>
<meta name="description" content="Haircuts, fades, lineups and designs by the barbers at Made2Fade in Stafford, VA.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/cuts.js" type="module"></script>
</head>
<body data-page="cuts">

<main>
  <section class="page-hero center">
    <div class="wrap">
      <span class="eyebrow">The Portfolio</span>
      <h1>Fresh <span class="gold-text">Cuts</span></h1>
      <p>Real work from every chair at Made2Fade. Filter by barber to see their style.</p>
    </div>
  </section>
  <section class="page-body center">
    <div class="wrap">
      <div class="tabs scroll-tabs" role="tablist" id="cutTabs"></div>
      <div class="gallery-grid" id="cutGrid"></div>
      <button class="btn btn-ghost more-cuts" id="moreCuts" hidden>Show More</button>
      <a class="btn btn-gold more-cuts" id="cutBook" href="/barbers.html" hidden>Book</a>
    </div>
  </section>
  <section class="page-body">
    <div class="wrap reel">
      <video src="/assets/showcase.mp4" controls muted loop playsinline preload="metadata" aria-label="Made2Fade cut showcase video"></video>
      <div class="reel-copy reveal left">
        <span class="eyebrow">In The Chair</span>
        <h3>Watch the <span class="gold-text">work</span></h3>
        <p>Every fade, every lineup, every detail. Follow along on Instagram for the latest cuts straight from the chair.</p>
        <a href="https://www.instagram.com/made2fade_llc" data-link="instagram" target="_blank" rel="noopener" class="btn btn-ghost">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
          @made2fade_llc
        </a>
      </div>
    </div>
  </section>
</main>

</body>
</html>
